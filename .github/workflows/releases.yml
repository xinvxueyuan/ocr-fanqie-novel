name: 🚀 Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: 📦 Build & Publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write  # trusted publishing to PyPI via OIDC

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔨 Setup uv
        uses: astral-sh/setup-uv@v6

      - name: 🔨 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: pyproject.toml

      - name: 🧪 Run tests
        run: |
          uv sync --all-groups
          uv run pytest -m "not smoke" -o addopts="-q --cov=src/plugins/nonebot_plugin_ocr_fanqie_novel --cov-branch --cov-report=term-missing"

      - name: 📦 Build package
        run: uv build

      - name: 🏷️ Derive version
        id: version
        run: |
          version="${{ github.ref_name }}"
          version="${version#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: 🚀 Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

      - name: 🏷️ Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ocr-fanqie-novel v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: dist/*
